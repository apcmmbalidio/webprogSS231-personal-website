<!DOCTYPE html>
<html>
<head>
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flexbox-grid.css">
</head>
<body>
  <div class="grid-container">
    <!-- Header Section -->
    <div class="header">
      <h1>Contact Us</h1>
    </div>

    <!-- Contact Information -->
    <div class="contact-info">
      <h2>Our Contact Details</h2>
      <p>If you have any questions, feel free to reach out!</p>
      <ul>
        <li>Email: <a href="mailto:info@example.com">info@example.com</a></li>
        <li>Phone: +1 234 567 890</li>
        <li>Address: 123 Main Street, City, Country</li>
      </ul>
    </div>

    <!-- Comment Section -->
    <div id="commentApp" class="comments-section">
      <h2>Leave a Comment</h2>
      <form v-on:submit.prevent="addComment" class="comment-form">
        <p>
          <label for="name">Name:</label>
          <input type="text" id="name" v-model="newComment.name" required placeholder="Your name">
        </p>
        <p>
          <label for="message">Message:</label>
          <textarea id="message" v-model="newComment.message" required placeholder="Your message"></textarea>
        </p>
        <button type="submit">Submit</button>
      </form>

      <h3>Comments</h3>
      <div v-for="comment in comments" class="comment">
        <p><strong>{{ comment.name }}</strong></p>
        <p>{{ comment.message }}</p>
        <p><small>{{ comment.timestamp }}</small></p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
