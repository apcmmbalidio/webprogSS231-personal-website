<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Comment Section with Vue.js</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column">
    <main class="flex-shrink-0">
        <section class="py-5">
            <div id="app" class="container">
                <h1 class="text-center">Comments</h1>
                <!-- Comment Form -->
                <form @submit.prevent="addComment" class="mb-4">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" v-model="newComment.name" class="form-control" id="name" required />
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Comment</label>
                        <textarea v-model="newComment.message" class="form-control" id="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Post Comment</button>
                </form>
                <!-- Comment List -->
                <div v-if="comments.length" class="comment-list">
                    <div v-for="(comment, index) in comments" :key="index" class="mb-3">
                        <div class="border rounded p-3">
                            <h5>{{ comment.name }}</h5>
                            <p>{{ comment.message }}</p>
                            <small class="text-muted">{{ comment.timestamp }}</small>
                        </div>
                    </div>
                </div>
                <div v-else class="text-center text-muted">No comments yet. Be the first to comment!</div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="app.js"></script>
</body>
</html>
